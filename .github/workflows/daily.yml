name: Daily date update

on:
  schedule:
    # GitHub delays scheduled runs (often by hours) and sometimes drops them, so
    # several morning triggers are set; the first one to run writes the date and
    # the rest exit as already updated. Beijing time 06:17 / 07:17 / 08:17 / 09:17.
    - cron: "17 22 * * *"
    - cron: "17 23 * * *"
    - cron: "17 0 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch: # allows a manual run from the Actions page

permissions:
  contents: write

# Delayed triggers can fire together; run them one at a time so the later ones
# see the earlier commit instead of failing to push.
concurrency:
  group: daily-date-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai # date and commit time in Beijing time; the contribution graph uses the commit's time zone
    steps:
      - uses: actions/checkout@v7

      - name: Write today's date and commit
        run: |
          today=$(date +%F)
          printf '# Daily log\n\nToday: %s\n' "$today" > README.md
          git config user.name "Dragolone"
          git config user.email "160818051+Dragolone@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && { echo "Already updated today"; exit 0; }
          git commit -m "Update date $today"
          git push
