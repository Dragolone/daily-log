name: 每日更新日期

on:
  schedule:
    - cron: "17 1 * * *" # UTC 01:17 = 北京时间 09:17（避开整点高峰，延迟也不会跨天）
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai # 日期和提交时间都按北京时间，贡献图按提交里的时区计日
    steps:
      - uses: actions/checkout@v7

      - name: 写入今天日期并提交
        run: |
          today=$(date +%F)
          printf '# 每日记录\n\n今天：%s\n' "$today" > README.md
          git config user.name "Dragolone"
          git config user.email "160818051+Dragolone@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && { echo "今天已更新过"; exit 0; }
          git commit -m "更新日期 $today"
          git push
